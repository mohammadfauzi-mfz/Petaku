name: Build APK

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'sync/**'      # data sinkron dari aplikasi tidak memicu build
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Tulis nomor build (dipakai fitur pembaruan)
        run: echo "export const BUILD = ${{ github.run_number }};" > www/js/version.js

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: |
          npx cap add android
          python3 tools/patch_android.py .
          npx cap sync android

      - name: Pakai keystore tetap (APK baru bisa menimpa APK lama)
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Siapkan APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Petaku.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Petaku-apk
          path: Petaku.apk

      - name: Rilis otomatis (aplikasi memeriksa Release terbaru)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Petaku 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: Petaku.apk
          body: |
            Build otomatis nomor ${{ github.run_number }}.
            Di aplikasi: Pengaturan (⚙) → Periksa pembaruan.
