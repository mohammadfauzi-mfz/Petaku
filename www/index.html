<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b5d3b">
<title>Petaku</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand">Petaku</div>
    <select id="themeSel" aria-label="Jenis peta"></select>
    <button id="btnInfo" class="icon" aria-label="Pengaturan">⚙</button>
  </header>
  <main id="pages">
    <section id="p-map" class="page active">
      <canvas id="cv"></canvas>
      <div class="fabs">
        <button id="bFit" class="fab" title="Tampilkan semua">⛶</button>
        <button id="bLbl" class="fab" title="Label blok">Aa</button>
        <button id="bFind" class="fab" title="Cari blok">⌕</button>
        <button id="bZi" class="fab" title="Perbesar">+</button>
        <button id="bZo" class="fab" title="Perkecil">−</button>
      </div>
      <div id="legendChip" class="legendChip"></div>
      <div id="mapStatus" class="mapStatus"></div>
      <div id="loading" class="loading">Memuat peta…</div>
    </section>
    <section id="p-data" class="page scroll"></section>
    <section id="p-theme" class="page scroll"></section>
    <section id="p-layers" class="page scroll"></section>
    <section id="p-export" class="page scroll"></section>
  </main>
  <nav id="nav">
    <button data-p="map" class="active"><i>🗺</i><span>Peta</span></button>
    <button data-p="data"><i>📄</i><span>Data</span></button>
    <button data-p="theme"><i>🎨</i><span>Tema</span></button>
    <button data-p="layers"><i>🗂</i><span>Layer</span></button>
    <button data-p="export"><i>🖨</i><span>Ekspor</span></button>
  </nav>
</div>
<div id="sheetHost"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
